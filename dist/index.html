<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fc">
  <meta name="description" content="A day-by-day calendar for the Walt Disney World trip.">
  <title>Disney Trip Calendar</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/leaflet/leaflet.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4m8-4v4m-8 8h2m4 0h2m-8 3h2"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M4 9h16M4 15h16M10 4v16"/></symbol>
    <symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>
    <symbol id="pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 10-8 10s-8-5-8-10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="currentColor" stroke="none"/><circle cx="15" cy="17" r="2.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="edit" viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l4.5-1 11-11a2 2 0 0 0-3-3l-11 11L4 20Z"/></symbol>
  </svg>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <span class="brand-icon"><svg><use href="#calendar"/></svg></span>
        <div><h1>Disney Trip Calendar</h1><p id="trip-range"></p></div>
      </div>
      <div class="top-actions">
        <button class="button outline manage" id="manage" type="button" aria-label="Manage trip days"><svg><use href="#settings"/></svg><span>Manage days</span></button>
        <button class="button primary top-add" id="add-event" type="button"><svg><use href="#plus"/></svg>New event</button>
      </div>
    </div>
  </header>
  <main class="workspace">
    <section class="date-navigation" aria-label="Trip days">
      <button class="icon-button date-step" id="prev" aria-label="Previous day"><svg><use href="#left"/></svg></button>
      <div class="tabs" id="tabs" role="tablist" aria-label="Trip days"></div>
      <button class="icon-button date-step" id="next" aria-label="Next day"><svg><use href="#right"/></svg></button>
      <button class="icon-button date-add" id="add-day" aria-label="Add a day" title="Add a day"><svg><use href="#plus"/></svg></button>
    </section>
    <div class="park-picker" id="park-picker">
      <label for="day-park">Park for this day</label>
      <select id="day-park"></select>
    </div>
    <div class="layout">
      <section class="schedule panel" id="schedule" role="tabpanel" tabindex="0">
        <div class="schedule-head">
          <div class="day-heading">
            <p id="selected-date" class="date-label"></p>
            <h2 id="day-title"></h2>
            <p id="day-subtitle" class="subtitle"></p>
          </div>
          <div class="view-toggle" aria-label="Schedule view">
            <button id="grid-view" aria-pressed="true" type="button" title="Day"><svg><use href="#grid"/></svg><span>Day</span></button>
            <button id="map-view" aria-pressed="false" type="button" title="Map"><svg><use href="#pin"/></svg><span>Map</span></button>
          </div>
        </div>
        <div id="schedule-body"></div>
      </section>
      <aside class="sidebar">
        <section class="panel side-panel" id="day-details">
          <div class="side-heading"><h2>Day notes</h2><button class="icon-button" id="edit-day" aria-label="Edit day notes" title="Edit day notes"><svg><use href="#edit"/></svg></button></div>
          <p id="day-notes"></p>
        </section>
        <section class="panel side-panel legend-panel">
          <h2>Event colors</h2>
          <div id="legend" class="legend"></div>
        </section>
      </aside>
    </div>
  </main>
  <button class="fab" id="mobile-add" type="button" aria-label="New event"><svg><use href="#plus"/></svg></button>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
